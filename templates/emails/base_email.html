<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RIOT{% endblock %}</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        /* Reset */

        img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { margin: 0; padding: 0; width: 100% !important; background-color: #0a0a0a; }

        /* Typography */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

        /* Dark streetwear aesthetic */
        .email-wrapper { background-color: #0a0a0a; padding: 40px 20px; }
        .email-container { max-width: 600px; margin: 0 auto; background-color: #141414; border-radius: 12px; overflow: hidden; border: 1px solid #1e1e1e; }
        .email-header { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); padding: 32px 40px; text-align: center; border-bottom: 2px solid #d4a843; }
        .email-logo { font-family: 'Inter', Arial, sans-serif; font-size: 32px; font-weight: 900; color: #ffffff; letter-spacing: 6px; text-transform: uppercase; text-decoration: none; }
        .email-logo span { color: #d4a843; }
        .email-body { padding: 40px; }
        .email-body h1 { font-family: 'Inter', Arial, sans-serif; font-size: 24px; font-weight: 700; color: #ffffff; margin: 0 0 16px 0; line-height: 1.3; }
        .email-body h2 { font-family: 'Inter', Arial, sans-serif; font-size: 18px; font-weight: 600; color: #d4a843; margin: 24px 0 12px 0; }
        .email-body p { font-family: 'Inter', Arial, sans-serif; font-size: 15px; color: #b0b0b0; line-height: 1.7; margin: 0 0 16px 0; }
        .email-body a { color: #d4a843; text-decoration: underline; }

        /* CTA Button */
        .cta-button { display: inline-block; background: linear-gradient(135deg, #d4a843 0%, #b8922e 100%); color: #0a0a0a !important; font-family: 'Inter', Arial, sans-serif; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; padding: 16px 40px; border-radius: 6px; text-decoration: none !important; margin: 24px 0; }
        .cta-button:hover { background: linear-gradient(135deg, #e0b64d 0%, #d4a843 100%); }

        /* Secondary Button */
        .cta-secondary { display: inline-block; border: 2px solid #d4a843; color: #d4a843 !important; font-family: 'Inter', Arial, sans-serif; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 12px 32px; border-radius: 6px; text-decoration: none !important; margin: 16px 8px; }

        /* Discount Code Box */
        .discount-box { background-color: #1e1e1e; border: 2px dashed #d4a843; border-radius: 8px; padding: 20px; text-align: center; margin: 24px 0; }
        .discount-code { font-family: 'Inter', monospace; font-size: 28px; font-weight: 900; color: #d4a843; letter-spacing: 4px; }
        .discount-label { font-family: 'Inter', Arial, sans-serif; font-size: 12px; color: #888888; text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; }

        /* Product Card */
        .product-card { background-color: #1a1a1a; border-radius: 8px; overflow: hidden; margin: 12px 0; border: 1px solid #252525; }
        .product-card img { width: 100%; max-height: 200px; object-fit: cover; }
        .product-card-info { padding: 16px; }
        .product-card-name { font-family: 'Inter', Arial, sans-serif; font-size: 15px; font-weight: 600; color: #ffffff; margin: 0 0 4px 0; }
        .product-card-price { font-family: 'Inter', Arial, sans-serif; font-size: 14px; color: #d4a843; font-weight: 700; }
        .product-card-size { font-family: 'Inter', Arial, sans-serif; font-size: 12px; color: #888888; margin-top: 4px; }

        /* Order Table */
        .order-table { width: 100%; border-collapse: collapse; margin: 16px 0; }
        .order-table th { font-family: 'Inter', Arial, sans-serif; font-size: 11px; color: #888888; text-transform: uppercase; letter-spacing: 1px; padding: 8px; text-align: left; border-bottom: 1px solid #252525; }
        .order-table td { font-family: 'Inter', Arial, sans-serif; font-size: 14px; color: #d0d0d0; padding: 12px 8px; border-bottom: 1px solid #1e1e1e; }
        .order-total { font-family: 'Inter', Arial, sans-serif; font-size: 18px; font-weight: 700; color: #d4a843; }

        /* Divider */
        .divider { border: none; border-top: 1px solid #252525; margin: 32px 0; }

        /* Footer */
        .email-footer { background-color: #0a0a0a; padding: 32px 40px; text-align: center; border-top: 1px solid #1e1e1e; }
        .email-footer p { font-family: 'Inter', Arial, sans-serif; font-size: 12px; color: #555555; margin: 4px 0; }
        .email-footer a { color: #888888; text-decoration: none; }
        .social-links { margin: 16px 0; }
        .social-links a { display: inline-block; margin: 0 8px; color: #888888; font-size: 13px; text-decoration: none; font-family: 'Inter', Arial, sans-serif; }

        /* Responsive */
        @media only screen and (max-width: 640px) {
            .email-container { border-radius: 0; }
            .email-body { padding: 24px 20px; }
            .email-header { padding: 24px 20px; }
            .email-footer { padding: 24px 20px; }
            .email-body h1 { font-size: 20px; }
            .cta-button { padding: 14px 28px; font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
            <tr>
                <td align="center">
                    <div class="email-container">
                        <!-- Header -->
                        <div class="email-header">
                            <a href="{% url 'index' %}" class="email-logo">RI<span>OT</span></a>
                        </div>

                        <!-- Body -->
                        <div class="email-body">
                            {% block content %}{% endblock %}
                        </div>

                        <!-- Footer -->
                        <div class="email-footer">
                            <div class="social-links">
                                <a href="https://instagram.com/riotinc7">Instagram</a> &nbsp;•&nbsp;
                                <a href="#">WhatsApp</a> &nbsp;•&nbsp;
                                <a href="{{ site_url }}">Shop</a>
                            </div>
                            <p>&copy; Copyright © 2025 RIOT Streetwear. All rights reserved.</p>
                            <p style="margin-top: 12px;">
                                <a href="{{ site_url }}" style="color: #555555;">Visit riot.ng</a>
                            </p>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
